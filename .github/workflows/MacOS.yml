name: "🖥️ macOS Direct VNC via Tailscale"

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "GitHub macOS runner label"
        required: true
        default: "macos-15"
        type: choice
        options:
          - macos-15
          - macos-14
          - macos-latest
      keepalive_minutes:
        description: "How long to keep direct VNC alive. GitHub-hosted runners max about 6 hours."
        required: true
        default: "330"
        type: string
      tailscale_tags:
        description: "Tailscale tags for OAuth/OIDC login, comma-separated (example: tag:ci)"
        required: false
        default: "tag:ci"
        type: string

concurrency:
  group: macos-direct-vnc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  macos-direct-vnc:
    name: "macOS Direct VNC"
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 355

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
      TAILSCALE_AUDIENCE: ${{ secrets.TAILSCALE_AUDIENCE }}
      TAILSCALE_TAGS: ${{ inputs.tailscale_tags }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}

    steps:
      - name: "✅ Validate input and Tailscale secret"
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ${#VNC_PASSWORD} -ne 8 ]]; then
            echo "VNC_PASSWORD must be exactly 8 characters"
            exit 1
          fi

          if [[ -z "$TAILSCALE_AUTHKEY" && -z "$TAILSCALE_AUTH_KEY" && -z "$TAILSCALE_OAUTH_CLIENT_ID" && -z "$TAILSCALE_OAUTH_SECRET" && -z "$TAILSCALE_AUDIENCE" ]]; then
            echo "❌ Missing Tailscale credential. Provide either:"
            echo "   - TAILSCALE_AUTHKEY or legacy TAILSCALE_AUTH_KEY"
            echo "   - TAILSCALE_OAUTH_CLIENT_ID + TAILSCALE_OAUTH_SECRET + tailscale_tags"
            echo "   - TAILSCALE_OAUTH_CLIENT_ID + TAILSCALE_AUDIENCE + tailscale_tags"
            exit 1
          fi

          if [[ -n "$TAILSCALE_TAGS" ]]; then
            echo "✅ Tailscale tags: $TAILSCALE_TAGS"
          fi

          KEEPALIVE_MINUTES="${{ inputs.keepalive_minutes }}"
          if ! [[ "$KEEPALIVE_MINUTES" =~ ^[0-9]+$ ]]; then
            echo "❌ keepalive_minutes must be a number"
            exit 1
          fi
          if (( KEEPALIVE_MINUTES < 5 )); then KEEPALIVE_MINUTES=5; fi
          if (( KEEPALIVE_MINUTES > 350 )); then KEEPALIVE_MINUTES=350; fi
          echo "KEEPALIVE_MINUTES=$KEEPALIVE_MINUTES" >> "$GITHUB_ENV"
          echo "✅ Input valid. Keep-alive: ${KEEPALIVE_MINUTES} minutes"

      - name: "👤 Resolve active GUI user"
        shell: bash
        run: |
          set -Eeuo pipefail

          # Use the active console user for the macOS desktop session.
          CONSOLE_USER="$(stat -f %Su /dev/console 2>/dev/null || true)"
          if [[ -z "$CONSOLE_USER" || "$CONSOLE_USER" == "root" || "$CONSOLE_USER" == "loginwindow" ]]; then
            echo "❌ Could not resolve the active console user"
            echo "   /dev/console returned: '${CONSOLE_USER:-<empty>}'"
            exit 1
          fi
          GUI_UID="$(id -u "$CONSOLE_USER")"

          echo "REMOTE_USER=$CONSOLE_USER" >> "$GITHUB_ENV"
          echo "GUI_UID=$GUI_UID" >> "$GITHUB_ENV"
          echo "✅ Active GUI user: $CONSOLE_USER (uid=$GUI_UID)"

      - name: "⚡ Optimize and keep display awake"
        shell: bash
        run: |
          set -Eeuo pipefail
          ok() { printf '  ✅ %s\n' "$*"; }

          defaults write com.apple.universalaccess reduceTransparency -bool true 2>/dev/null || true
          defaults write com.apple.universalaccess reduceMotion -bool true 2>/dev/null || true
          defaults write NSGlobalDomain NSWindowResizeTime -float 0.001 2>/dev/null || true
          defaults write com.apple.dock autohide-delay -float 0 2>/dev/null || true
          defaults write NSGlobalDomain NSAppSleepDisabled -bool true 2>/dev/null || true
          ok "UI animation reduced"

          sudo mdutil -a -i off 2>/dev/null || true
          ok "Spotlight disabled"

          sudo systemsetup -setsleep Never 2>/dev/null || true
          sudo systemsetup -setdisplaysleep Never 2>/dev/null || true
          sudo pmset -a sleep 0 displaysleep 0 disksleep 0 powernap 0 2>/dev/null || true
          ok "Sleep/display sleep disabled"

          nohup caffeinate -dimsu > /tmp/caffeinate.log 2>&1 &
          echo "$!" > /tmp/caffeinate.pid
          ok "caffeinate started to prevent black/sleeping display"

      - name: "🛡️ Best-effort Screen Recording permission for Screen Sharing"
        shell: bash
        run: |
          set -Eeuo pipefail
          ok() { printf '  ✅ %s\n' "$*"; }
          warn() { printf '  ⚠️  %s\n' "$*"; }

          # macOS may show black screen if Screen Sharing / ARD has no screen-capture permission.
          # GitHub-hosted macOS does not expose System Settings UI, so this is best effort only.
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          if [[ ! -f "$TCC_DB" ]]; then
            warn "System TCC database not found; skipping TCC best-effort grant"
            exit 0
          fi

          grant_tcc_auth_value() {
            local service="$1"
            local client="$2"
            local client_type="$3"
            sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access
              (service, client, client_type, auth_value, auth_reason, auth_version,
               csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier,
               indirect_object_code_identity, flags, last_modified)
              VALUES
              ('$service', '$client', $client_type, 2, 4, 1,
               NULL, NULL, 0, 'UNUSED', NULL, 0, strftime('%s','now'));" 2>/dev/null || true
          }

          for service in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent; do
            grant_tcc_auth_value "$service" "com.apple.screensharing.agent" 0
            grant_tcc_auth_value "$service" "com.apple.RemoteManagement" 0
            grant_tcc_auth_value "$service" "/System/Library/CoreServices/RemoteManagement/ARDAgent.app" 1
            grant_tcc_auth_value "$service" "/System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd" 1
          done

          sudo killall tccd 2>/dev/null || true
          ok "TCC best-effort permissions applied"

      - name: "🔐 Enable macOS VNC / Screen Sharing on active user"
        shell: bash
        run: |
          set -Eeuo pipefail

          ok() { printf '  ✅ %s\n' "$*"; }
          warn() { printf '  ⚠️  %s\n' "$*"; }
          die() { printf '  ❌ %s\n' "$*"; exit 1; }
          step() { printf '\n▶ %s\n' "$*"; }

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          [[ -x "$KICKSTART" ]] || die "kickstart tool not found: $KICKSTART"

          sudo dseditgroup -o edit -a "$REMOTE_USER" -t user admin 2>/dev/null || true
          ok "Active GUI user dipastikan berada di grup admin"

          step "Reset ARD/Screen Sharing"
          sudo "$KICKSTART" -deactivate -stop 2>/dev/null || true
          sudo launchctl bootout system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl disable system/com.apple.screensharing 2>/dev/null || true
          sleep 2

          step "Enable legacy VNC password and console display"
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsAllowed -bool true 2>/dev/null || true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true 2>/dev/null || true

          step "Activate Apple Remote Desktop"
          sudo "$KICKSTART" \
            -activate \
            -configure -access -on \
            -configure -allowAccessFor -allUsers \
            -configure -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -menu 2>/tmp/kickstart.log \
            && ok "ARD aktif" \
            || { warn "kickstart returned non-zero; showing diagnostic"; cat /tmp/kickstart.log || true; }

          step "Start Screen Sharing launch service"
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
          sleep 5

          step "Wait VNC port 5900"
          VNC_OK=false
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 5900 2>/dev/null; then
              VNC_OK=true
              ok "VNC listening di 127.0.0.1:5900 pada attempt $i/30"
              break
            fi
            printf '  ... attempt %02d/30\r' "$i"
            sleep 2
          done
          echo
          if [[ "$VNC_OK" != "true" ]]; then
            sudo lsof -nP -iTCP:5900 -sTCP:LISTEN 2>/dev/null || true
            sudo launchctl list | grep -Ei 'screen|remote|ard' || true
            die "VNC port 5900 tidak aktif"
          fi

      - name: "🖼️ Force active desktop session and verify screenshot"
        shell: bash
        run: |
          set -Eeuo pipefail
          ok() { printf '  ✅ %s\n' "$*"; }
          warn() { printf '  ⚠️  %s\n' "$*"; }

          run_gui() {
            sudo launchctl asuser "$GUI_UID" sudo -u "$REMOTE_USER" "$@"
          }

          run_gui open -a Finder
          run_gui open -a Terminal
          sleep 3
          ok "Finder & Terminal launched on active GUI user: $REMOTE_USER"

          for wp in \
            "/System/Library/Desktop Pictures/Sonoma.heic" \
            "/System/Library/Desktop Pictures/Monterey Graphic.heic" \
            "/System/Library/Desktop Pictures/Big Sur.heic" \
            "/System/Library/Desktop Pictures/Catalina.heic"; do
            if [[ -f "$wp" ]]; then
              run_gui osascript -e "tell application \"System Events\" to set picture of every desktop to \"$wp\""
              ok "Wallpaper attempted: $(basename "$wp")"
              break
            fi
          done

          # Create a visible marker on Desktop so black-screen diagnosis is easier.
          DESKTOP="/Users/$REMOTE_USER/Desktop"
          mkdir -p "$DESKTOP" 2>/dev/null || true
          cat > "$DESKTOP/DIRECT_VNC_READY.txt" <<TXT
          Direct VNC is connected to active user: $REMOTE_USER
          If you can read this file, the remote desktop is working.
          TXT
          sudo chown "$REMOTE_USER":staff "$DESKTOP/NO_VNC_READY.txt" 2>/dev/null || true

          if screencapture -x /tmp/display_test.png 2>/dev/null; then
            bytes="$(wc -c < /tmp/display_test.png | tr -d ' ')"
            ok "Display aktif; screenshot ${bytes} bytes"
            python3 - <<'PY' || true
          from pathlib import Path
          p = Path('/tmp/display_test.png')
          if p.exists() and p.stat().st_size < 20000:
              print('  ⚠️  Screenshot size is very small; display may still be black/headless')
          PY
          else
            warn "screencapture failed; VNC may still run but desktop may be headless"
          fi

      - name: "📦 Install VNC authentication test dependency"
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv /tmp/vnc-test-venv
          /tmp/vnc-test-venv/bin/python -m pip install --upgrade pip -q
          /tmp/vnc-test-venv/bin/python -m pip install pycryptodome -q
          echo "VNC_TEST_PY=/tmp/vnc-test-venv/bin/python" >> "$GITHUB_ENV"
          echo "✅ VNC authentication test dependency installed"

      - name: "🧪 Test direct VNC authentication"
        shell: bash
        run: |
          set -Eeuo pipefail

          ok() { printf '  ✅ %s\n' "$*"; }
          warn() { printf '  ⚠️  %s\n' "$*"; }
          die() { printf '  ❌ %s\n' "$*"; exit 1; }
          step() { printf '\n▶ %s\n' "$*"; }

          cat > /tmp/vnc_auth_check.py <<'PY'
          import os, socket, struct
          from Crypto.Cipher import DES

          host = os.environ.get("VNC_HOST", "127.0.0.1")
          port = int(os.environ.get("VNC_PORT", "5900"))
          password = os.environ["VNC_PASSWORD"]

          def recvn(sock, n):
              data = b""
              while len(data) < n:
                  chunk = sock.recv(n - len(data))
                  if not chunk:
                      raise RuntimeError("connection closed while reading")
                  data += chunk
              return data

          def revbits(byte):
              return int(f"{byte:08b}"[::-1], 2)

          def vnc_response(challenge, pw):
              raw = pw.encode("latin-1", "ignore")[:8].ljust(8, b"\0")
              key = bytes(revbits(b) for b in raw)
              return DES.new(key, DES.MODE_ECB).encrypt(challenge)

          with socket.create_connection((host, port), timeout=10) as s:
              proto = recvn(s, 12)
              if not proto.startswith(b"RFB "):
                  raise RuntimeError(f"unexpected protocol header: {proto!r}")

              s.sendall(b"RFB 003.008\n")
              n = recvn(s, 1)[0]
              if n == 0:
                  msg_len = struct.unpack(">I", recvn(s, 4))[0]
                  reason = recvn(s, msg_len).decode("utf-8", "replace")
                  raise RuntimeError(f"server refused before auth: {reason}")

              sec_types = list(recvn(s, n))
              print("Offered security types:", sec_types)
              if 2 not in sec_types:
                  raise RuntimeError("VNCAuth security type 2 not offered. Legacy VNC password is not active.")

              s.sendall(bytes([2]))
              challenge = recvn(s, 16)
              s.sendall(vnc_response(challenge, password))
              result = struct.unpack(">I", recvn(s, 4))[0]
              if result != 0:
                  reason = ""
                  try:
                      msg_len = struct.unpack(">I", recvn(s, 4))[0]
                      if msg_len:
                          reason = recvn(s, msg_len).decode("utf-8", "replace")
                  except Exception:
                      pass
                  raise RuntimeError(f"VNC authentication failed. Result={result}. {reason}")

          print("VNC authentication OK")
          PY

          step "Run VNC auth self-test"
          if "$VNC_TEST_PY" /tmp/vnc_auth_check.py; then
            ok "VNC password verified against 127.0.0.1:5900"
          else
            warn "First auth test failed. Re-applying ARD VNC password once..."
            KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
            sudo "$KICKSTART" \
              -activate \
              -configure -access -on \
              -configure -allowAccessFor -allUsers \
              -configure -privs -all \
              -clientopts -setvnclegacy -vnclegacy yes \
              -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
              -restart -agent -menu 2>/tmp/kickstart-retry.log || true
            sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
            sleep 5
            "$VNC_TEST_PY" /tmp/vnc_auth_check.py \
              && ok "VNC password verified after retry" \
              || { cat /tmp/kickstart-retry.log || true; die "VNC auth tetap gagal. URL tidak akan ditampilkan karena credential belum valid."; }
          fi

      - name: "🔗 Connect Tailscale using TAILSCALE_AUTHKEY"
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: mac-runner-${{ github.run_id }}

      - name: "🔗 Connect Tailscale using legacy TAILSCALE_AUTH_KEY"
        if: ${{ env.TAILSCALE_AUTHKEY == '' && env.TAILSCALE_AUTH_KEY != '' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: mac-runner-${{ github.run_id }}

      - name: "🔗 Connect Tailscale using OAuth client"
        if: ${{ env.TAILSCALE_AUTHKEY == '' && env.TAILSCALE_AUTH_KEY == '' && env.TAILSCALE_OAUTH_CLIENT_ID != '' && env.TAILSCALE_OAUTH_SECRET != '' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: ${{ inputs.tailscale_tags }}
          hostname: mac-runner-${{ github.run_id }}

      - name: "🔗 Connect Tailscale using workload identity"
        if: ${{ env.TAILSCALE_AUTHKEY == '' && env.TAILSCALE_AUTH_KEY == '' && env.TAILSCALE_OAUTH_CLIENT_ID != '' && env.TAILSCALE_OAUTH_SECRET == '' && env.TAILSCALE_AUDIENCE != '' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: ${{ inputs.tailscale_tags }}
          hostname: mac-runner-${{ github.run_id }}

      - name: "📡 Resolve Tailscale IP"
        shell: bash
        run: |
          set -Eeuo pipefail
          ok() { printf '  ✅ %s\n' "$*"; }
          die() { printf '  ❌ %s\n' "$*"; exit 1; }

          TS_IP=""
          for i in $(seq 1 30); do
            TS_IP="$(tailscale ip -4 2>/dev/null | head -n1 || true)"
            if [[ -n "$TS_IP" ]]; then
              break
            fi
            printf '  ... waiting Tailscale IP %02d/30\r' "$i"
            sleep 2
          done
          echo
          [[ -n "$TS_IP" ]] || { tailscale status || true; die "Tailscale IP tidak ditemukan"; }
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          ok "Tailscale IP: $TS_IP"

          if ! nc -z -w 5 127.0.0.1 5900; then
            die "Local VNC port 5900 is not listening"
          fi

          if ! nc -z -w 5 "$TS_IP" 5900; then
            sudo lsof -nP -iTCP:5900 -sTCP:LISTEN 2>/dev/null || true
            die "VNC port 5900 is not reachable through Tailscale IP"
          fi
          ok "VNC reachable through Tailscale on TCP 5900"

      - name: "📋 Direct VNC access and keep alive"
        shell: bash
        run: |
          set -Eeuo pipefail

          cat <<EOF_SUMMARY >> "$GITHUB_STEP_SUMMARY"
          # macOS Direct VNC Ready

          | Field | Value |
          |---|---|
          | Tailscale IP | $TAILSCALE_IP |
          | VNC port | 5900 |
          | VNC password | GitHub secret VNC_PASSWORD |
          | macOS user | $REMOTE_USER |

          Connect using AVNC with the Tailscale IP and port 5900.
          EOF_SUMMARY

          echo "============================================================"
          echo "macOS Direct VNC Ready"
          echo "Tailscale IP : $TAILSCALE_IP"
          echo "VNC port     : 5900"
          echo "VNC password : GitHub secret VNC_PASSWORD (hidden)"
          echo "macOS user   : $REMOTE_USER"
          echo "Client       : AVNC / VNC Viewer"
          echo "============================================================"

          end=$((SECONDS + KEEPALIVE_MINUTES * 60))
          tick=0

          while (( SECONDS < end )); do
            tick=$((tick + 1))
            ts="$(date '+%H:%M:%S')"

            TS_JSON="$(python3 -c 'import subprocess; print(subprocess.run(["tailscale","status","--json"],capture_output=True,text=True,timeout=8,check=True).stdout)' 2>/dev/null || true)"
            TS_STATE="$(printf '%s' "$TS_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState","unknown"))' 2>/dev/null || echo unknown)"
            TS_IP_NOW="$(python3 -c 'import subprocess; p=subprocess.run(["tailscale","ip","-4"],capture_output=True,text=True,timeout=8,check=True); print(p.stdout.strip().splitlines()[0] if p.stdout.strip() else "")' 2>/dev/null || true)"
            TS_DAEMON="$(pgrep -x tailscaled >/dev/null 2>&1 && echo yes || echo no)"

            echo "🩺 [$ts] Tailscale | state=$TS_STATE | ip=\${TS_IP_NOW:-none} | tailscaled=$TS_DAEMON"

            if [[ "$TS_STATE" == "Running" && -n "$TS_IP_NOW" ]]; then
              echo "🌐 [$ts] Tailscale online | $TS_IP_NOW"
            else
              echo "⚠️ [$ts] Tailscale offline or daemon not responding"
            fi

            if nc -z -w 5 127.0.0.1 5900 2>/dev/null; then
              echo "✅ [$ts] Local VNC port 5900 online"
            else
              echo "⚠️ [$ts] VNC down; restarting Screen Sharing"
              sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
              sleep 5
            fi

            if (( tick % 3 == 0 )); then
              sudo launchctl asuser "$GUI_UID" sudo -u "$REMOTE_USER" open -a Finder 2>/dev/null || true
            fi

            echo "✅ [$ts] alive #$tick | VNC $TAILSCALE_IP:5900"
            sleep 300
          done

          echo "Keep-alive finished after \${KEEPALIVE_MINUTES} minutes."
